{{- range .Values.services }}
{{- $service := . }}
{{- $root := $ }}
{{- if $root.Values.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "poscafe.fullname" $root }}-{{ $service.name }}
spec:
  minAvailable: {{ $root.Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels: { app.kubernetes.io/name: {{ $service.name }} }
{{- end }}
{{- if $root.Values.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "poscafe.fullname" $root }}-{{ $service.name }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "poscafe.fullname" $root }}-{{ $service.name }}
  minReplicas: {{ $root.Values.autoscaling.minReplicas }}
  maxReplicas: {{ $root.Values.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: {{ $root.Values.autoscaling.targetCPUUtilizationPercentage }} }
{{- end }}
{{- end }}
