apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "poscafe.fullname" . }}-default-deny
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  egress:
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
      ports: [{ protocol: UDP, port: 53 }, { protocol: TCP, port: 53 }]
    - to:
        - namespaceSelector: { matchLabels: { app.kubernetes.io/part-of: poscafe } }
      ports: [{ protocol: TCP, port: 5432 }, { protocol: TCP, port: 27017 }, { protocol: TCP, port: 9092 }]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: {{ .Release.Namespace }} } }
      ports: [{ protocol: TCP, port: 8080 }]
