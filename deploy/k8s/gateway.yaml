apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels: { app: poscafe-gateway }
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector: { matchLabels: { app: poscafe-gateway } }
  template:
    metadata: { labels: { app: poscafe-gateway } }
    spec:
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      terminationGracePeriodSeconds: 30
      containers:
        - name: gateway
          image: ghcr.io/example/poscafe-gateway:replace-me
          ports: [{ name: http, containerPort: 8080 }]
          envFrom: [{ configMapRef: { name: poscafe-runtime } }]
          env:
            - name: ConnectionStrings__opsdb
              valueFrom: { secretKeyRef: { name: poscafe-secrets, key: OPSDB_CONNECTION_STRING } }
            - name: Jwt__Key
              valueFrom: { secretKeyRef: { name: poscafe-secrets, key: JWT_KEY } }
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /alive, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 1000m, memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: { drop: [ALL] }
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  selector: { app: poscafe-gateway }
  ports: [{ name: http, port: 80, targetPort: http }]
