apiVersion: apps/v1
kind: Deployment
metadata: { name: order, labels: { app: poscafe-order, app.kubernetes.io/part-of: poscafe } }
spec:
  replicas: 2
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  selector: { matchLabels: { app: poscafe-order } }
  template:
    metadata: { labels: { app: poscafe-order, app.kubernetes.io/part-of: poscafe } }
    spec:
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      terminationGracePeriodSeconds: 30
      containers:
        - name: order
          image: ghcr.io/example/poscafe-order:replace-me
          ports: [{ name: http, containerPort: 8080 }]
          envFrom: [{ configMapRef: { name: poscafe-runtime } }]
          env:
            - { name: ConnectionStrings__orderdb, valueFrom: { secretKeyRef: { name: poscafe-secrets, key: ORDERDB_CONNECTION_STRING } } }
            - { name: Jwt__Key, valueFrom: { secretKeyRef: { name: poscafe-secrets, key: JWT_KEY } } }
          readinessProbe: { httpGet: { path: /health, port: http }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /alive, port: http }, initialDelaySeconds: 15, periodSeconds: 20 }
          resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { cpu: 1000m, memory: 512Mi } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, runAsNonRoot: true, capabilities: { drop: [ALL] } }
---
apiVersion: v1
kind: Service
metadata: { name: order }
spec: { selector: { app: poscafe-order }, ports: [{ name: http, port: 80, targetPort: http }] }
---
